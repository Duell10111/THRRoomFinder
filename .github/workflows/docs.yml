name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m pip check
      - name: Build documentation
        run: |
          python -m sphinx -b html docs _build/docs/html
          python -m sphinx -b epub docs _build/docs/epub
          python -m sphinx -b latex docs _build/docs/latex
