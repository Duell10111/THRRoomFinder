name: E2E Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:15-3.3-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: user
          POSTGRES_DB: roomFinderDB
        options: >-
          --health-cmd "pg_isready -U user -d roomFinderDB"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend and Cypress
        uses: cypress-io/github-action@v7
        with:
          working-directory: frontend
          runTests: false
      - name: Install E2E services
        run: npm ci --prefix e2e
      - name: Build backend from the tested commit
        run: ./gradlew bootJar --no-daemon
        working-directory: roomfinder-backend
      - name: Build frontend for the local test services
        run: npm run build:frontend --prefix e2e
      - name: Run E2E suite twice without retries
        run: npm test --prefix e2e
        env:
          E2E_BROWSER: chrome
          E2E_REPEAT: '2'
      - name: Upload test diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            e2e/logs
